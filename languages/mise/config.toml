# The mise config files, as TOML with mise's runnables, tasks and snippets, and the scripts of
# tasks highlighted. Zed picks the language whose suffix matches the longest part of the path, so
# these win over TOML's `toml`. A suffix matches the file name or the path, as is or after a dot:
# `mise.toml` covers `.mise.toml` and `.config/mise.toml`, `config/mise/config.toml` covers
# `.config/mise/config.toml`, and `mise/config.toml` covers only `.mise/config.toml`. Other config
# files (`mise/config.toml`, `conf.d/*.toml`, other environments) stay TOML unless `file_types`
# maps them here.
name = "mise"
grammar = "mise_toml"
path_suffixes = [
    "mise.toml",
    "mise.local.toml",
    "mise.dev.toml",
    "mise.dev.local.toml",
    "mise.development.toml",
    "mise.test.toml",
    "mise.ci.toml",
    "mise.staging.toml",
    "mise.prod.toml",
    "mise.production.toml",
    "config/mise/config.toml",
    "config/mise/config.local.toml",
    "mise/config.toml",
    "mise/config.local.toml",
]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
