# Usage specs (https://usage.jdx.dev/): the `usage` of a mise task, and `*.usage.kdl` files. KDL,
# with usage's directives as keywords.
name = "Usage"
grammar = "usage_kdl"
path_suffixes = ["usage.kdl"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 0 }
autoclose_before = ",)}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
