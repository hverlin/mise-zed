id = "mise"
name = "mise"
version = "0.1.0"
schema_version = 1
authors = ["hverlin"]
description = "mise config files (diagnostics, completion, hover, formatting from `mise lsp`, highlighted task scripts), .tool-versions files, task and tool runners, and snippets"
repository = "https://github.com/hverlin/mise-zed"

languages = ["languages/mise", "languages/mise-shell", "languages/tool-versions", "languages/usage"]
snippets = ["snippets/mise.json", "snippets/shell script.json"]

# The grammars live in this repository; Zed checks them out at `rev`, a commit that has them.
# `mise_toml` is tree-sitter-toml with the content of strings as a node, for the scripts of tasks.
[grammars.mise_toml]
repository = "https://github.com/hverlin/mise-zed"
rev = "6b06dd4d665ca1211eff81dc42df11f9906653c6"
path = "tree-sitter-mise-toml"

[grammars.tool_versions]
repository = "https://github.com/hverlin/mise-zed"
rev = "6b06dd4d665ca1211eff81dc42df11f9906653c6"
path = "tree-sitter-tool-versions"

# tree-sitter-kdl 2.0.0, renamed: usage specs are KDL 2, the `kdl` grammar of the KDL extension
# reads KDL 1
[grammars.usage_kdl]
repository = "https://github.com/hverlin/mise-zed"
rev = "6b06dd4d665ca1211eff81dc42df11f9906653c6"
path = "tree-sitter-usage-kdl"

# On TOML too, for the config files the `mise` language does not match (`mise/config.toml`,
# `conf.d/*.toml`), but only for users who enable it: it would start in every Rust or Python
# project
[language_servers.mise]
name = "mise"
languages = ["mise", "TOML"]
opt_in_languages = ["TOML"]

[language_servers.mise.language_ids]
"mise" = "toml"
"TOML" = "toml"

# `mise help lsp`, to know the mise binary has `mise lsp` before starting it
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["help", "lsp"]
